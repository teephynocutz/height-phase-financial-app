<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- KEYWORD-OPTIMIZED TITLE -->
    <title>Heightphase | Financial Consulting, Wealth Management & Investment Solutions</title>

    <!-- SEO META DESCRIPTION -->
    <meta name="description" content="Heightphase is a modern financial consulting and investment firm offering personalized financial planning, portfolio management, tax-efficient investing, and wealth growth strategies." />

    <meta name="author" content="Heightphase" />

    <!-- CANONICAL URL -->
    <link rel="canonical" href="https://www.heightphase.com" />

    <!-- STRUCTURED DATA (SCHEMA) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialService",
      "name": "Heightphase",
      "url": "https://www.heightphase.com",
      "description": "Financial consulting and investment firm specializing in personalized planning, portfolio management, and wealth growth strategies.",
      "areaServed": "Global",
      "serviceType": "Financial Consulting & Investment Solutions",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Financial Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Personalized Financial Planning & Advisory"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Investment Strategy & Portfolio Management"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Tax-Efficient Wealth Optimization"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Business Financial Advisory"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Wealth Preservation Strategies"
            }
          }
        ]
      }
    }
    </script>

    <!-- THEME COLOR -->
    <meta name="theme-color" content="#0a0a0a" />

    <meta property="og:description" content="Build, grow, and protect your wealth with data-driven strategies, personalized planning, and expert investment solutions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.heightphase.com" />
    <meta property="og:image" content="https://www.heightphase.com/logo.png" />
    <meta property="og:site_name" content="Heightphase" />

    <meta name="twitter:card" content="summary_large_image" />
